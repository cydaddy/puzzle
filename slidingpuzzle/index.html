<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬라이딩 퍼즐 🧩</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  :root {
    --bg: #0f0f1a;
    --card-bg: #1a1a2e;
    --accent1: #e94560;
    --accent3: #16213e;
    --text: #eaeaea;
    --gold: #ffd700;
  }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  /* ========== START SCREEN ========== */
  #startScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 28px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  #startScreen h1 {
    font-size: 3.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, #e94560, #ffd700, #0f3460);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }

  .settings-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .settings-group label {
    font-size: 1.15rem;
    font-weight: 600;
    color: #aaa;
  }

  .option-row {
    display: flex;
    gap: 10px;
  }

  .option-btn {
    padding: 12px 24px;
    font-size: 1.2rem;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    border: 3px solid #333;
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .option-btn:hover { border-color: var(--accent1); transform: translateY(-2px); }
  .option-btn.selected { border-color: var(--accent1); background: var(--accent1); color: #fff; box-shadow: 0 0 20px rgba(233,69,96,0.4); }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .toggle-label {
    font-size: 1.05rem;
    font-weight: 600;
    color: #aaa;
  }

  .toggle-switch {
    position: relative;
    width: 56px;
    height: 30px;
    background: #333;
    border-radius: 15px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .toggle-switch.active { background: var(--accent1); }

  .toggle-switch .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    background: #fff;
    border-radius: 50%;
    transition: left 0.3s;
  }

  .toggle-switch.active .knob { left: 29px; }

  #startBtn {
    margin-top: 8px;
    padding: 16px 56px;
    font-size: 1.5rem;
    font-weight: 800;
    font-family: 'Outfit', sans-serif;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent1), #ff6b81);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 30px rgba(233,69,96,0.5);
    transition: all 0.2s ease;
  }

  #startBtn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 8px 40px rgba(233,69,96,0.6); }

  /* ========== GAME SCREEN ========== */
  #gameScreen {
    display: none;
    flex-direction: column;
    height: 100vh;
    animation: fadeIn 0.4s ease;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 20px;
    background: var(--card-bg);
    border-bottom: 2px solid #222;
    flex-shrink: 0;
    gap: 14px;
  }

  .top-bar-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent1);
  }

  .top-bar button {
    padding: 6px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    border: 2px solid #444;
    border-radius: 10px;
    background: var(--accent3);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .top-bar button:hover { border-color: var(--accent1); background: var(--accent1); }

  /* Boards container: horizontal columns */
  .boards-container {
    flex: 1;
    display: flex;
    flex-direction: row;
    overflow: hidden;
  }

  /* Each player column */
  .player-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    border-right: 2px solid #222;
    overflow: hidden;
  }

  .player-column:last-child { border-right: none; }

  /* Player header */
  .player-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 6px 0;
    width: 100%;
    flex-shrink: 0;
  }

  .player-label {
    font-size: 1rem;
    font-weight: 700;
    padding: 3px 14px;
    border-radius: 8px;
    color: #fff;
  }

  .move-count {
    font-size: 0.85rem;
    font-weight: 600;
    color: #888;
  }

  /* Puzzle area — fills the column, puzzle can move vertically inside */
  .puzzle-area {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .puzzle-positioner {
    width: 90%;
    max-width: 500px;
    transition: transform 0.3s ease;
  }

  .puzzle-grid {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    background: #111;
    position: relative;
    aspect-ratio: 1 / 1;
  }

  /* 피스는 절대 위치로 배치 — CSS transition으로 부드럽게 이동 */
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    border-radius: 8px;
    cursor: pointer;
    /* 이동 모션: 위치 이동 + 미세 스케일 효과 */
    transition: transform 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                filter 0.15s ease;
    will-change: transform;
    box-sizing: border-box;
  }

  .tile:not(.empty):hover {
    filter: brightness(1.25);
    z-index: 2;
  }

  .tile.empty {
    background: transparent !important;
    cursor: default;
    pointer-events: none;
  }

  .win-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    z-index: 10;
    animation: fadeIn 0.4s ease;
  }

  .win-text {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--gold);
    text-align: center;
    text-shadow: 0 0 20px rgba(255,215,0,0.6);
  }

  /* Height slider at bottom of each column */
  .height-slider-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 8px;
    flex-shrink: 0;
    width: 100%;
    background: rgba(26,26,46,0.7);
  }

  .height-slider-wrap label {
    font-size: 0.75rem;
    font-weight: 600;
    color: #666;
    white-space: nowrap;
  }

  .height-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 80%;
    max-width: 200px;
    height: 6px;
    border-radius: 3px;
    background: #333;
    outline: none;
  }

  .height-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent1);
    cursor: pointer;
  }

  .height-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: var(--accent1);
    cursor: pointer;
  }

  /* Player colors */
  .player-color-0 { background: linear-gradient(135deg, #e94560, #ff6b81); }
  .player-color-1 { background: linear-gradient(135deg, #0f3460, #3a86ff); }
  .player-color-2 { background: linear-gradient(135deg, #2d6a4f, #52b788); }
  .player-color-3 { background: linear-gradient(135deg, #9b5de5, #c77dff); }
  .player-color-4 { background: linear-gradient(135deg, #f77f00, #fcbf49); }
  .player-color-5 { background: linear-gradient(135deg, #00b4d8, #90e0ef); }

  .tile-color-0 { background: #e94560; color: #fff; }
  .tile-color-1 { background: #3a86ff; color: #fff; }
  .tile-color-2 { background: #52b788; color: #fff; }
  .tile-color-3 { background: #c77dff; color: #fff; }
  .tile-color-4 { background: #f77f00; color: #fff; }
  .tile-color-5 { background: #00b4d8; color: #fff; }

  /* Rank badge */
  .rank-badge {
    font-size: 0.95rem;
    font-weight: 800;
    padding: 2px 10px;
    border-radius: 8px;
    background: var(--gold);
    color: #111;
    animation: pop 0.4s ease;
  }

  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }

  /* Column border color per player */
  .col-border-0 { border-color: rgba(233,69,96,0.3) !important; }
  .col-border-1 { border-color: rgba(58,134,255,0.3) !important; }
  .col-border-2 { border-color: rgba(82,183,136,0.3) !important; }
  .col-border-3 { border-color: rgba(199,125,255,0.3) !important; }
  .col-border-4 { border-color: rgba(247,127,0,0.3) !important; }
  .col-border-5 { border-color: rgba(0,180,216,0.3) !important; }
</style>
</head>
<body>

<!-- ====== START SCREEN ====== -->
<div id="startScreen">
  <h1>🧩 슬라이딩 퍼즐</h1>

  <div class="settings-group">
    <label>퍼즐 크기</label>
    <div class="option-row" id="sizeOptions">
      <button class="option-btn" data-value="2">2×2</button>
      <button class="option-btn" data-value="3">3×3</button>
      <button class="option-btn selected" data-value="4">4×4</button>
      <button class="option-btn" data-value="5">5×5</button>
    </div>
  </div>

  <div class="settings-group">
    <label>플레이어 수</label>
    <div class="option-row" id="playerOptions">
      <button class="option-btn" data-value="1">1명</button>
      <button class="option-btn selected" data-value="2">2명</button>
      <button class="option-btn" data-value="3">3명</button>
      <button class="option-btn" data-value="4">4명</button>
      <button class="option-btn" data-value="5">5명</button>
      <button class="option-btn" data-value="6">6명</button>
    </div>
  </div>

  <div class="settings-group">
    <div class="toggle-row">
      <span class="toggle-label" style="color:#555">다른 퍼즐</span>
      <div class="toggle-switch active" id="samePuzzleToggle">
        <div class="knob"></div>
      </div>
      <span class="toggle-label">같은 퍼즐</span>
    </div>
  </div>

  <button id="startBtn">게임 시작 🚀</button>
</div>

<!-- ====== GAME SCREEN ====== -->
<div id="gameScreen">
  <div class="top-bar">
    <span class="top-bar-title">🧩 슬라이딩 퍼즐</span>
    <button id="restartBtn">🔄 다시 시작</button>
    <button id="backBtn">◀ 메뉴로</button>
  </div>
  <div class="boards-container" id="boardsContainer"></div>
</div>

<script>
(function() {
  // ---- Sound Engine (Web Audio API) ----
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // 브라우저 정책으로 suspended 상태일 경우 resume
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  /**
   * 피스 슬라이딩 사운드
   * 짧고 묵직한 "탁" 소리 — filtered noise burst
   * count: 한 번에 몇 개 피스가 움직이는지 (여러 개면 약간 더 풍성하게)
   */
  function playSlideSfx(count = 1) {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    for (let i = 0; i < count; i++) {
      const delay = i * 0.045; // 여러 피스가 연속으로 움직일 때 미세한 딜레이

      // Noise 생성 (화이트 노이즈 버퍼)
      const bufLen = ctx.sampleRate * 0.06;
      const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let j = 0; j < bufLen; j++) data[j] = Math.random() * 2 - 1;

      const noise = ctx.createBufferSource();
      noise.buffer = buf;

      // 밴드패스 필터: 탁 소리 중역대만 통과
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 800 + Math.random() * 200;
      filter.Q.value = 0.8;

      // 볼륨 엔벨로프
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, now + delay);
      gain.gain.linearRampToValueAtTime(0.35, now + delay + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.06);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now + delay);
      noise.stop(now + delay + 0.07);

      // 짧은 톤 클릭 (피스 닿는 느낌)
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180 + i * 30, now + delay);
      osc.frequency.exponentialRampToValueAtTime(90, now + delay + 0.05);

      const oscGain = ctx.createGain();
      oscGain.gain.setValueAtTime(0.18, now + delay);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.06);

      osc.connect(oscGain);
      oscGain.connect(ctx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.07);
    }
  }

  /**
   * 퍼즐 완성 팡파레
   * 밝고 경쾌한 상승 아르페지오
   */
  function playWinSfx() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    // C5 Major arpeggio + octave
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];

    notes.forEach((freq, i) => {
      const delay = i * 0.1;

      const osc = ctx.createOscillator();
      osc.type = i < 4 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now + delay);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, now + delay);
      gain.gain.linearRampToValueAtTime(0.3, now + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.5);

      // 잔향처럼 들리는 간단한 딜레이 (코러스 효과)
      const delay2 = ctx.createDelay();
      delay2.delayTime.value = 0.03;
      const delayGain = ctx.createGain();
      delayGain.gain.value = 0.3;

      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.connect(delay2);
      delay2.connect(delayGain);
      delayGain.connect(ctx.destination);

      osc.start(now + delay);
      osc.stop(now + delay + 0.55);
    });
  }

  // ---- State ----
  let gridSize = 4;
  let playerCount = 2;
  let samePuzzle = true;
  let boards = []; // { tiles:[], moves:0, solved:false, rank:0 }
  let finishOrder = 0;

  const playerNames = ['Player 1', 'Player 2', 'Player 3', 'Player 4', 'Player 5', 'Player 6'];
  const playerEmojis = ['🔴', '🔵', '🟢', '🟣', '🟠', '🩵'];

  // ---- DOM ----
  const startScreen = document.getElementById('startScreen');
  const gameScreen = document.getElementById('gameScreen');
  const boardsContainer = document.getElementById('boardsContainer');
  const sizeOptions = document.getElementById('sizeOptions');
  const playerOptions = document.getElementById('playerOptions');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const backBtn = document.getElementById('backBtn');
  const samePuzzleToggle = document.getElementById('samePuzzleToggle');

  // ---- Option Selection ----
  function setupOptionGroup(container, callback) {
    container.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        callback(parseInt(btn.dataset.value));
      });
    });
  }

  setupOptionGroup(sizeOptions, v => gridSize = v);
  setupOptionGroup(playerOptions, v => playerCount = v);

  samePuzzleToggle.addEventListener('click', () => {
    samePuzzle = !samePuzzle;
    samePuzzleToggle.classList.toggle('active', samePuzzle);
  });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  backBtn.addEventListener('click', () => {
    gameScreen.style.display = 'none';
    startScreen.style.display = 'flex';
  });

  // ---- Puzzle Generation ----
  function generateSolvedTiles(n) {
    const total = n * n;
    const tiles = [];
    for (let i = 1; i < total; i++) tiles.push(i);
    tiles.push(0);
    return tiles;
  }

  function shufflePuzzle(n) {
    const tiles = generateSolvedTiles(n);
    const total = n * n;
    let emptyIdx = total - 1;
    const moves = n * n * 40;

    for (let m = 0; m < moves; m++) {
      const row = Math.floor(emptyIdx / n);
      const col = emptyIdx % n;
      const neighbors = [];
      if (row > 0) neighbors.push(emptyIdx - n);
      if (row < n - 1) neighbors.push(emptyIdx + n);
      if (col > 0) neighbors.push(emptyIdx - 1);
      if (col < n - 1) neighbors.push(emptyIdx + 1);
      const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
      tiles[emptyIdx] = tiles[pick];
      tiles[pick] = 0;
      emptyIdx = pick;
    }

    if (isSolved(tiles, n)) return shufflePuzzle(n);
    return tiles.slice();
  }

  function isSolved(tiles, n) {
    const total = n * n;
    for (let i = 0; i < total - 1; i++) {
      if (tiles[i] !== i + 1) return false;
    }
    return tiles[total - 1] === 0;
  }

  // ---- Start Game ----
  function startGame() {
    finishOrder = 0;
    boards = [];

    const baseTiles = shufflePuzzle(gridSize);

    for (let p = 0; p < playerCount; p++) {
      const tiles = samePuzzle ? baseTiles.slice() : shufflePuzzle(gridSize);
      boards.push({ tiles, moves: 0, solved: false, rank: 0 });
    }

    startScreen.style.display = 'none';
    gameScreen.style.display = 'flex';

    renderAllBoards();
  }

  // ---- Rendering ----
  function renderAllBoards() {
    boardsContainer.innerHTML = '';

    boards.forEach((board, pIdx) => {
      // Column
      const col = document.createElement('div');
      col.className = 'player-column col-border-' + pIdx;

      // Header
      const header = document.createElement('div');
      header.className = 'player-header';

      const label = document.createElement('span');
      label.className = 'player-label player-color-' + pIdx;
      label.id = 'label-' + pIdx;
      label.textContent = playerEmojis[pIdx] + ' ' + playerNames[pIdx];

      const moveEl = document.createElement('span');
      moveEl.className = 'move-count';
      moveEl.id = 'moves-' + pIdx;
      moveEl.textContent = '0';

      header.appendChild(label);
      header.appendChild(moveEl);

      // Puzzle area
      const puzzleArea = document.createElement('div');
      puzzleArea.className = 'puzzle-area';

      const positioner = document.createElement('div');
      positioner.className = 'puzzle-positioner';
      positioner.id = 'positioner-' + pIdx;

      const grid = document.createElement('div');
      grid.className = 'puzzle-grid';
      grid.id = 'grid-' + pIdx;
      grid.style.gridTemplateColumns = 'repeat(' + gridSize + ', 1fr)';
      grid.style.gridTemplateRows = 'repeat(' + gridSize + ', 1fr)';

      renderTiles(grid, board, pIdx);

      positioner.appendChild(grid);
      puzzleArea.appendChild(positioner);

      // Height slider
      const sliderWrap = document.createElement('div');
      sliderWrap.className = 'height-slider-wrap';

      const sliderLabel = document.createElement('label');
      sliderLabel.textContent = '↕ 높이';

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'height-slider';
      slider.min = '0';
      slider.max = '100';
      slider.value = '10';
      slider.id = 'hslider-' + pIdx;

      slider.addEventListener('input', () => {
        applyHeightForPlayer(pIdx);
      });

      sliderWrap.appendChild(sliderLabel);
      sliderWrap.appendChild(slider);

      col.appendChild(header);
      col.appendChild(puzzleArea);
      col.appendChild(sliderWrap);
      boardsContainer.appendChild(col);

      // Apply initial height
      applyHeightForPlayer(pIdx);
    });

    recalcAllFontSizes();
  }

  function applyHeightForPlayer(pIdx) {
    const slider = document.getElementById('hslider-' + pIdx);
    const positioner = document.getElementById('positioner-' + pIdx);
    if (!slider || !positioner) return;

    const val = parseInt(slider.value); // 0 = top, 100 = bottom
    // Translate the positioner downward within the puzzle-area
    // We calculate offset as percentage of parent height
    const puzzleArea = positioner.parentElement;
    const areaH = puzzleArea.clientHeight;
    const posH = positioner.clientHeight;
    const maxOffset = Math.max(0, areaH - posH - 10);
    const offset = (val / 100) * maxOffset;
    positioner.style.transform = 'translateY(' + offset + 'px)';
  }

  /**
   * 최초 1회: DOM 피스 엘리먼트를 생성하고 grid에 붙임.
   * 이후 이동 시에는 updateTilePositions()만 호출.
   */
  function renderTiles(grid, board, pIdx) {
    grid.innerHTML = '';
    board._tileEls = {}; // val -> DOM element 맵

    const n = gridSize;
    const gap = 3;  // px (grid padding/gap)

    board.tiles.forEach((val, idx) => {
      const tile = document.createElement('div');
      tile.className = 'tile' + (val === 0 ? ' empty' : ' tile-color-' + pIdx);
      tile.textContent = val === 0 ? '' : val;
      tile.dataset.val = val;

      if (val !== 0 && !board.solved) {
        tile.addEventListener('click', () => {
          // 현재 이 타일의 논리 인덱스를 board.tiles에서 찾아서 전달
          const curIdx = board.tiles.indexOf(val);
          handleTileClick(pIdx, curIdx);
        });
      }

      grid.appendChild(tile);
      if (val !== 0) board._tileEls[val] = tile;
      else board._emptyEl = tile;
    });

    // 초기 위치 설정 (transition 없이 즉시)
    positionTilesInstant(grid, board);
    requestAnimationFrame(() => recalcFontSize(grid));
  }

  /** transition 없이 모든 피스를 현재 board.tiles 기준으로 배치 */
  function positionTilesInstant(grid, board) {
    const n = gridSize;
    board.tiles.forEach((val, idx) => {
      const el = val === 0 ? board._emptyEl : board._tileEls[val];
      if (!el) return;
      const row = Math.floor(idx / n);
      const col = idx % n;
      setTileTransform(el, row, col, n);
    });
    sizeTiles(grid, board, n);
  }

  /** CSS transform으로 피스 위치를 설정 */
  function setTileTransform(el, row, col, n) {
    const gap = 3;
    const cellPct = (100 - gap * (n + 1) / /* grid width≈100% */ 1) / n;
    // % 기반 계산: 각 셀(gap 포함)의 오프셋
    el.style.transform = `translate(
      calc(${col} * (100% + ${gap}px) + ${gap}px),
      calc(${row} * (100% + ${gap}px) + ${gap}px)
    )`;
    el.style.left = '0';
    el.style.top = '0';
  }

  /** 피스 크기를 grid 크기에 맞게 조정 */
  function sizeTiles(grid, board, n) {
    requestAnimationFrame(() => {
      const rect = grid.getBoundingClientRect();
      if (rect.width <= 0) return;
      const gap = 3;
      const cellSize = (rect.width - gap * (n + 1)) / n;
      const allEls = Object.values(board._tileEls).concat(board._emptyEl ? [board._emptyEl] : []);
      allEls.forEach(el => {
        el.style.width = cellSize + 'px';
        el.style.height = cellSize + 'px';
        el.style.left = '0';
        el.style.top = '0';
      });
    });
  }

  /**
   * 이동 후: 실제로 움직인 피스들만 transform을 업데이트.
   * DOM을 다시 그리지 않으므로 CSS transition이 살아있음.
   */
  function animateTileMove(grid, board, movedVals) {
    const n = gridSize;
    movedVals.forEach(val => {
      const newIdx = board.tiles.indexOf(val);
      const el = val === 0 ? board._emptyEl : board._tileEls[val];
      if (!el) return;
      const row = Math.floor(newIdx / n);
      const col = newIdx % n;
      setTileTransform(el, row, col, n);
    });
  }

  function recalcAllFontSizes() {
    requestAnimationFrame(() => {
      document.querySelectorAll('.puzzle-grid').forEach(grid => recalcFontSize(grid));
    });
  }

  function recalcFontSize(grid) {
    const rect = grid.getBoundingClientRect();
    if (rect.width <= 0) return;
    const tileSize = (rect.width - (gridSize + 1) * 3) / gridSize;
    const fontSize = Math.max(10, Math.min(tileSize * 0.42, 52));
    grid.querySelectorAll('.tile').forEach(t => {
      t.style.fontSize = fontSize + 'px';
    });
  }

  // ---- Group Sliding Logic ----
  function handleTileClick(pIdx, clickedIdx) {
    const board = boards[pIdx];
    if (board.solved) return;

    const emptyIdx = board.tiles.indexOf(0);
    const clickedRow = Math.floor(clickedIdx / gridSize);
    const clickedCol = clickedIdx % gridSize;
    const emptyRow = Math.floor(emptyIdx / gridSize);
    const emptyCol = emptyIdx % gridSize;

    let tilesToMove = [];

    if (clickedRow === emptyRow && clickedCol !== emptyCol) {
      // Same row
      const dir = clickedCol < emptyCol ? 1 : -1;
      let col = clickedCol;
      while (col !== emptyCol) {
        tilesToMove.push(clickedRow * gridSize + col);
        col += dir;
      }
    } else if (clickedCol === emptyCol && clickedRow !== emptyRow) {
      // Same column
      const dir = clickedRow < emptyRow ? 1 : -1;
      let row = clickedRow;
      while (row !== emptyRow) {
        tilesToMove.push(row * gridSize + clickedCol);
        row += dir;
      }
    } else {
      return;
    }

    // 이동할 피스들의 값 수집 (DOM 업데이트용)
    tilesToMove.reverse();
    const movedVals = tilesToMove.map(tIdx => board.tiles[tIdx]);
    movedVals.push(0); // 빈 칸도 이동

    // 논리 배열 업데이트
    for (const tIdx of tilesToMove) {
      const currentEmpty = board.tiles.indexOf(0);
      board.tiles[currentEmpty] = board.tiles[tIdx];
      board.tiles[tIdx] = 0;
    }

    board.moves++;

    // DOM 피스 위치만 CSS transition으로 업데이트 (재생성 없음)
    const grid = document.getElementById('grid-' + pIdx);
    const movesEl = document.getElementById('moves-' + pIdx);
    const labelEl = document.getElementById('label-' + pIdx);

    animateTileMove(grid, board, movedVals);
    playSlideSfx(tilesToMove.length); // 피스 개수만큼 연속 슬라이딩 사운드
    movesEl.textContent = board.moves;

    // Check win
    if (isSolved(board.tiles, gridSize)) {
      board.solved = true;
      finishOrder++;
      board.rank = finishOrder;

      // 애니메이션이 끝난 후 win overlay 추가 + 승리 사운드
      setTimeout(() => {
        const overlay = document.createElement('div');
        overlay.className = 'win-overlay';
        overlay.innerHTML = '<div class="win-text">🎉 완성!<br>' + board.moves + ' moves</div>';
        grid.appendChild(overlay);
        playWinSfx();
      }, 200);

      if (board.rank) {
        const badge = document.createElement('span');
        badge.className = 'rank-badge';
        const rankText = board.rank === 1 ? '🥇 1등' : board.rank === 2 ? '🥈 2등' : board.rank === 3 ? '🥉 3등' : board.rank + '등';
        badge.textContent = rankText;
        labelEl.parentElement.appendChild(badge);
      }
    }
  }

  // ---- Resize ----
  window.addEventListener('resize', () => {
    recalcAllFontSizes();
    for (let i = 0; i < playerCount; i++) {
      applyHeightForPlayer(i);
      // 피스 크기도 재계산
      const grid = document.getElementById('grid-' + i);
      if (grid && boards[i]) {
        // transition 없이 즉시 재배치
        const allEls = Object.values(boards[i]._tileEls || {});
        if (boards[i]._emptyEl) allEls.push(boards[i]._emptyEl);
        allEls.forEach(el => el.style.transition = 'none');
        positionTilesInstant(grid, boards[i]);
        requestAnimationFrame(() => {
          allEls.forEach(el => el.style.transition = '');
        });
      }
    }
  });

})();
</script>
</body>
</html>
